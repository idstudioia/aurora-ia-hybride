<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256">
  <!-- AURORA logo (same design as LogoRing in App.tsx): desktop icon, favicon and window icon. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#0d2f5e"/><stop offset="100%" stop-color="#030914"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6fbff"/><stop offset="40%" stop-color="#22c8ff" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#2f7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fe8ff"/><stop offset="100%" stop-color="#2f7bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="24" cy="24" r="23.6" fill="url(#bg)"/>
  <circle cx="24" cy="24" r="23.1" fill="none" stroke="#22c8ff" stroke-opacity=".35" stroke-width=".6"/>
  <g filter="url(#glow)">
    <circle cx="24" cy="24" r="18.5" fill="none" stroke="url(#arc)" stroke-width="2.6"/>
    <circle cx="24" cy="24" r="13" fill="none" stroke="#22c8ff" stroke-opacity=".6" stroke-width="1.2" stroke-dasharray="3 3.4"/>
    <ellipse cx="24" cy="24" rx="21" ry="7" fill="none" stroke="#a8eeff" stroke-opacity=".8" stroke-width="1.4"
      transform="rotate(-28 24 24)"/>
    <circle cx="24" cy="24" r="9" fill="url(#core)"/>
    <circle cx="41.6" cy="14.6" r="1.5" fill="#c8f6ff"/>
  </g>
</svg>
